services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-web
    networks:
      - public-net
      - app-net

  app-web:
    image: nginx:alpine
    container_name: app-web
    volumes:
      - ./app:/usr/share/nginx/html
    networks:
      - app-net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: euqe3tfh
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: euqe3tfh
    depends_on:
      - postgres
    networks:
      - app-net
      - backend-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-latest
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: euqe3tfh
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - app-net
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - backend-net

volumes:
  pg_data:

networks:
  public-net:
    driver: bridge
  app-net:
    driver: bridge
  backend-net:
    driver: bridge