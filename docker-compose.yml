version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-web
    networks:
      - public-net
      - app-net

  app-web:
    image: nginx:alpine
    container_name: app-web
    volumes:
      - ./app:/usr/share/nginx/html
    networks:
      - app-net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - app-net
      - backend-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-latest
    container_name: zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - zabbix-server
      - postgres
    ports:
      - "8080:8080"
    networks:
      - app-net
      - backend-net

  zabbix-agent-postgres:
    image: zabbix/zabbix-agent:ubuntu-latest
    container_name: zabbix-agent-postgres
    environment:
      ZBX_HOSTNAME: PostgreSQL
      ZBX_SERVER_HOST: zabbix-server
    depends_on:
      - postgres
      - zabbix-server
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - zabbix-server
    networks:
      - backend-net

networks:
  public-net:
  app-net:
  backend-net:

volumes:
  pg_data: